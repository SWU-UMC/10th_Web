<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      height: 600px;
      margin: 0;
      position: relative;
    }

    .box {
      width: 300px;
      background-color: green;
      padding: 20px;
      text-align: center;

      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

  <div class="box">
    <p>가운데 정렬</p>
  </div>

</body>
</html>
